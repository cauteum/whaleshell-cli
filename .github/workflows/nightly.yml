#
# Manual nightly multi-arch binaries → GitHub Release tag `nightly`.
# Kept manual so the Releases page stays focused on the latest tested beta.
name: Nightly

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.repository }}
  cancel-in-progress: true

jobs:
  nightly:
    name: Build & publish nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cautem-cli
        uses: actions/checkout@v4
        with:
          path: cautem-cli
          fetch-depth: 0

      - name: Checkout sibling modules
        run: |
          set -euo pipefail
          declare -A REMOTES=(
            [cautem-core]=cautem/cautem-core
            [cautem-display]=cautem/cautem-display
            [cautem-driver]=cautem/cautem-driver
            [cautem-providers]=cautem/cautem-providers
            [cautem-proxy]=cautem/cautem-proxy
            [cautem-runtime]=cautem/cautem-runtime
            [cautem-sdk]=cautem/cautem-sdk
            [cautem-gateway]=cautem/cautem-gateway
            [slogx]=cautem/slogx
          )
          for local in \
            cautem-core cautem-display cautem-driver \
            cautem-providers cautem-proxy cautem-runtime \
            cautem-sdk cautem-gateway slogx
          do
            remote="${REMOTES[$local]}"
            if ! git clone --depth 1 --branch main \
              "https://github.com/${remote}.git" "${local}"; then
              git clone --depth 1 "https://github.com/${remote}.git" "${local}"
            fi
          done

      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cautem-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in cautem-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/cautem/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-alpha.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.6 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/cautem/slogx v0.1.0-alpha.1 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-alpha.2 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.1 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.2 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.3 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"


      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-cli/go.sum
            cautem-core/go.sum
            cautem-runtime/go.sum
            cautem-gateway/go.sum

      - name: Cross-compile release matrix
        working-directory: cautem-cli
        run: |
          set -euo pipefail
          ver="0.0.0-nightly.$(date -u +%Y%m%d)+$(git rev-parse --short HEAD)"
          echo "NIGHTLY_VERSION=${ver}" >> "$GITHUB_ENV"
          out="${{ github.workspace }}/dist"
          mkdir -p "$out"

          archive_os() {
            case "$1" in
              linux) echo Linux ;;
              darwin) echo Darwin ;;
              windows) echo Windows ;;
            esac
          }
          archive_arch() {
            case "$1" in
              amd64) echo x86_64 ;;
              *) echo "$1" ;;
            esac
          }

          helpers="${{ github.workspace }}/helpers"
          bash scripts/build-linux-helpers.sh "$ver" "$helpers" amd64 arm64

          # Same layout as GoReleaser: cautem + libexec/cautem/linux-<arch>/.
          build_cli() {
            local goos="$1" goarch="$2" ext="${3:-}"
            local name="cautem_$(archive_os "$goos")_$(archive_arch "$goarch")"
            local stage="${out}/stage-${name}"
            echo "→ ${name}"
            mkdir -p "${stage}/libexec/cautem"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags="-s -w -X github.com/cautem/cautem-cli/internal/service.BuildVersion=${ver}" \
              -o "${stage}/cautem${ext}" ./cmd/cautem
            cp -R "${helpers}/linux-${goarch}" "${stage}/libexec/cautem/"
            if [[ "$goos" != "windows" && -d ../cautem-gateway ]]; then
              GOOS="$goos" GOARCH="$goarch" go build -C ../cautem-gateway -trimpath -ldflags="-s -w" \
                -o "${stage}/cautem-gateway" ./cmd/cautem-gateway
            fi
            cp install.sh "${stage}/"
            if [[ "$goos" == "windows" ]]; then
              (cd "$stage" && zip -qr "${out}/${name}.zip" .)
            else
              tar -czf "${out}/${name}.tar.gz" -C "$stage" .
            fi
            rm -rf "$stage"
          }

          build_cli linux amd64
          build_cli linux arm64
          build_cli darwin amd64
          build_cli darwin arm64
          build_cli windows amd64 .exe

          if [[ -d ../cautem-gateway ]]; then
            for goos in linux darwin; do
              for goarch in amd64 arm64; do
                name="cautem-gateway_$(archive_os "$goos")_$(archive_arch "$goarch")"
                echo "→ ${name}"
                GOOS="$goos" GOARCH="$goarch" go build -C ../cautem-gateway -trimpath -ldflags="-s -w" \
                  -o "${out}/cautem-gateway" ./cmd/cautem-gateway
                (cd "$out" && tar -czf "${name}.tar.gz" cautem-gateway && rm -f cautem-gateway)
              done
            done
          fi

          (cd "$out" && sha256sum -- *.tar.gz *.zip | tee checksums.txt)
          cp install.sh "$out/"
          printf '%s\n' "$ver" > "$out/VERSION"

      - name: Publish GitHub Release (nightly / prerelease)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly ${{ env.NIGHTLY_VERSION }}"
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            Automated nightly build from `main` (workspace modules).

            **Not a stable release.** Prefer the latest tested beta for installations.

            ### Install
            ```bash
            curl -LsSf https://raw.githubusercontent.com/cautem/cautem-cli/main/install.sh | CAUTEM_VERSION=nightly sh
            ```
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
