            cautem-*/go.sum
            slogx/go.sum
      - name: Download modules
        run: go mod download
      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...
      - name: Test (race + coverage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Test (race)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: Test
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -count=1 ./...
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./cautem-cli/coverage.txt
          flags: unittests
          name: codecov-cautem-cli
          fail_ci_if_error: false

  release-dry-run:
    name: Release archives + install.sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cautem-cli
        uses: actions/checkout@v4
        with:
          path: cautem-cli
          fetch-depth: 0

      - name: Checkout cautem-driver candidate
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-driver
          path: cautem-driver
          ref: v0.1.6

      - name: Checkout cautem-gateway candidate
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-gateway
          path: cautem-gateway
          ref: release/v0.1.6

      - name: Checkout cautem-runtime candidate
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-runtime
          path: cautem-runtime
          ref: v0.1.6

      - name: Checkout cautem-sdk candidate
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-sdk
          path: cautem-sdk
          ref: release/v0.1.6

      - name: Checkout sibling modules at published tags
        run: |
          set -euo pipefail
          declare -A MODULES=(
            [cautem-core]=v0.1.6
            [cautem-display]=v0.1.6
            [cautem-providers]=v0.1.6
            [cautem-proxy]=v0.1.6
          )
          for m in cautem-core cautem-display cautem-providers cautem-proxy; do
            git clone --depth 1 --branch "${MODULES[$m]}" \
              "https://github.com/cautem/${m}.git" "${m}"
          done
          git clone --depth 1 --branch v0.1.3 \
            https://github.com/cautem/slogx.git slogx

      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cautem-* slogx; do echo "  ./$d"; done
            echo ')'
            echo 'replace ('
            for d in cautem-*; do echo "  github.com/cautem/${d} v0.1.0-alpha.1 => ./$d"; done
            for d in cautem-*; do echo "  github.com/cautem/${d} v0.1.0-alpha.2 => ./$d"; done
            for d in cautem-*; do echo "  github.com/cautem/${d} v0.1.0-beta.1 => ./$d"; done
            for d in cautem-*; do
              echo "  github.com/cautem/${d} v0.1.0-beta.2 => ./$d"
              echo "  github.com/cautem/${d} v0.1.6 => ./$d"
            done
            echo '  github.com/cautem/slogx v0.1.0-alpha.1 => ./slogx'
            echo '  github.com/cautem/slogx v0.1.0-alpha.2 => ./slogx'
            echo '  github.com/cautem/slogx v0.1.0-beta.1 => ./slogx'
            echo '  github.com/cautem/slogx v0.1.0-beta.2 => ./slogx'
            echo '  github.com/cautem/slogx v0.1.3 => ./slogx'
            echo ')'
          } > go.work

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-*/go.sum
            slogx/go.sum

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          workdir: cautem-cli
          args: release --snapshot --clean --skip=publish
        env:
          GOTOOLCHAIN: local

      - name: Verify archive layout and install.sh
        working-directory: cautem-cli
        shell: bash
        run: |
          set -euo pipefail
          for a in dist/cautem_Linux_x86_64.tar.gz dist/cautem_Darwin_arm64.tar.gz; do
            arch=amd64; [[ "$a" == *arm64* ]] && arch=arm64
            list="$(tar -tzf "$a")"
            for f in cautem cautem-gateway cautem-console \
                     "libexec/cautem/linux-${arch}/cautem" \
                     "libexec/cautem/linux-${arch}/cautem-init" \
                     "libexec/cautem/linux-${arch}/cautem-sshd"; do
              grep -qx "\(\./\)\?${f}" <<<"$list" || { echo "missing ${f} in ${a}"; echo "$list"; exit 1; }
            done
          done
          unzip -l dist/cautem_Windows_x86_64.zip | grep -q "libexec/cautem/linux-amd64/cautem-sshd"

          mkdir -p /tmp/rel && ln -s "$PWD/dist" /tmp/rel/snapshot
          CAUTEM_RELEASE_URL=file:///tmp/rel CAUTEM_VERSION=snapshot \
            CAUTEM_INSTALL_DIR=/tmp/prefix/bin sh ./install.sh
          test -x /tmp/prefix/bin/cautem
          test -x /tmp/prefix/bin/cautem-gateway
          test -x /tmp/prefix/bin/cautem-console
          test -x /tmp/prefix/libexec/cautem/linux-amd64/cautem-sshd
          /tmp/prefix/bin/cautem version
