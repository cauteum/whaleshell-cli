#
# Tagged releases via GoReleaser. Semver pre-release suffixes → GitHub prerelease
# (prerelease: auto) — same pattern as HashiCorp / many Go corporate CLIs.
name: Release

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v0.1.5)"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cauteum-cli
        uses: actions/checkout@v4
        with:
          path: cauteum-cli
          fetch-depth: 0

      - name: Check out requested tag for manual rebuild
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: git -C cauteum-cli checkout --detach "$RELEASE_TAG"

      - name: Checkout sibling modules
        run: |
          set -euo pipefail
          declare -A MODULES=(
            [cauteum-core]=cautem/cauteum-core@v0.1.5
            [cauteum-display]=cautem/cauteum-display@v0.1.5
            [cauteum-driver]=cautem/cauteum-driver@v0.1.5
            [cauteum-providers]=cautem/cauteum-providers@v0.1.5
            [cauteum-proxy]=cautem/cauteum-proxy@v0.1.5
            [cauteum-runtime]=cautem/cauteum-runtime@v0.1.5
            [cauteum-sdk]=cautem/cauteum-sdk@v0.1.5
            [cauteum-gateway]=cautem/cauteum-gateway@v0.1.5
            [slogx]=cautem/slogx@v0.1.3
          )
          for local in \
            cauteum-core cauteum-display cauteum-driver \
            cauteum-providers cauteum-proxy cauteum-runtime \
            cauteum-sdk cauteum-gateway slogx
          do
            module="${MODULES[$local]}"
            remote="${module%@*}"
            ref="${module##*@}"
            git clone --depth 1 --branch "$ref" \
              "https://github.com/${remote}.git" "${local}"
          done

      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cauteum-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in cauteum-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/cautem/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-alpha.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.5 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/cautem/slogx v0.1.0-alpha.1 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-alpha.2 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.3 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"


      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cauteum-cli/go.sum
            cauteum-core/go.sum
            cauteum-gateway/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          workdir: cauteum-cli
          args: release --clean --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOWORK: ${{ github.workspace }}/go.work
          GOTOOLCHAIN: local
