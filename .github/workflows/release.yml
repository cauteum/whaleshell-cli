#
# Tagged releases via GoReleaser. Semver pre-release suffixes → GitHub prerelease
# (prerelease: auto) — same pattern as HashiCorp / many Go corporate CLIs.
name: Release

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v0.1.7)"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cautem-cli
        uses: actions/checkout@v4
        with:
          path: cautem-cli
          fetch-depth: 0

      - name: Check out requested tag for manual rebuild
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: git -C cautem-cli checkout --detach "$RELEASE_TAG"

      - name: Checkout sibling modules
        run: |
          set -euo pipefail
          declare -A MODULES=(
            [cautem-core]=cautem/cautem-core@v0.1.6
            [cautem-display]=cautem/cautem-display@v0.1.6
            [cautem-driver]=cautem/cautem-driver@v0.1.7
            [cautem-providers]=cautem/cautem-providers@v0.1.6
            [cautem-proxy]=cautem/cautem-proxy@v0.1.6
            [cautem-runtime]=cautem/cautem-runtime@v0.1.6
            [cautem-sdk]=cautem/cautem-sdk@v0.1.6
            [cautem-gateway]=cautem/cautem-gateway@v0.1.6
            [slogx]=cautem/slogx@v0.1.3
          )
          for local in \
            cautem-core cautem-display cautem-driver \
            cautem-providers cautem-proxy cautem-runtime \
            cautem-sdk cautem-gateway slogx
          do
            module="${MODULES[$local]}"
            remote="${module%@*}"
            ref="${module##*@}"
            git clone --depth 1 --branch "$ref" \
              "https://github.com/${remote}.git" "${local}"
          done

      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cautem-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in cautem-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/cautem/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-alpha.2 => ./$d"
                if [[ "$d" == "cautem-driver" ]]; then
                  echo "  github.com/cautem/${d} v0.1.7 => ./$d"
                else
                  echo "  github.com/cautem/${d} v0.1.6 => ./$d"
                fi
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/cautem/slogx v0.1.0-alpha.1 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-alpha.2 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.3 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"


      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-cli/go.sum
            cautem-core/go.sum
            cautem-gateway/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          workdir: cautem-cli
          args: release --clean --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOWORK: ${{ github.workspace }}/go.work
          GOTOOLCHAIN: local
