#
# Tagged releases for cautem-cli (and companion gateway binary).
# Corporate alpha/beta/rc tags are auto-marked as GitHub prereleases.
version: 2

project_name: cautem

before:
  hooks:
    # Build both linux helper arches once. Archive `dst` is NOT templated by
    # GoReleaser, so every archive ships linux-amd64 + linux-arm64 under
    # libexec/cautem/ (install.sh / sandboxes pick the needed arch).
    - bash scripts/build-linux-helpers.sh {{ .Version }} build/helpers/libexec/cautem amd64 arm64

builds:
  - id: cautem
    main: ./cmd/cautem
    binary: cautem
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/cautem/cautem-cli/internal/service.BuildVersion={{.Version}}

  - id: cautem-gateway
    dir: ../cautem-gateway
    main: ./cmd/cautem-gateway
    binary: cautem-gateway
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

  - id: cautem-console
    main: ./cmd/cautem-console
    binary: cautem-console
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: cli
    # Gateway and console ride along on Linux/macOS for a plain install.sh setup.
    ids: [cautem, cautem-gateway, cautem-console]
    # windows has no gateway build
    allow_different_binary_count: true
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - NOTICE
      - README*
      - install.sh
      # Literal dst (no {{ .Arch }} — GoReleaser does not expand templates in dst).
      - src: build/helpers/libexec/cautem/linux-amd64/*
        dst: libexec/cautem/linux-amd64
        strip_parent: true
        info:
          mode: 0755
      - src: build/helpers/libexec/cautem/linux-arm64/*
        dst: libexec/cautem/linux-arm64
        strip_parent: true
        info:
          mode: 0755

  - id: gateway
    ids: [cautem-gateway]
    name_template: >-
      cautem-gateway_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    files:
      - LICENSE*
      - NOTICE

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  # Semver pre-release tags (v0.1.0-alpha.1, -beta.N, -rc.N) → GitHub prerelease.
  # Same pattern as HashiCorp / typical GoReleaser corporate CLIs.
  prerelease: auto
  name_template: "{{ .Tag }}"
  footer: |
    ## Install

    ```bash
    curl -LsSf https://raw.githubusercontent.com/cautem/cautem-cli/main/install.sh | sh
    ```

    Pin a tag:

    ```bash
    curl -LsSf https://raw.githubusercontent.com/cautem/cautem-cli/main/install.sh | CAUTEM_VERSION={{ .Tag }} sh
    ```

    **Alpha / pre-release:** APIs may change. See the development and release guide at cautem.github.io/sandbox.dev/reference/development/.

snapshot:
  version_template: "{{ .Version }}-next"
