# Builtin GitHub provider (OpenShell-style level C).
# Host: export GITHUB_TOKEN=… (or GH_TOKEN). Values stay on the host;
# guest sees cautem:resolve:env:GITHUB_TOKEN and the sidecar rewrites on egress.

id: github
display_name: GitHub
description: GitHub API and Git over HTTPS (clone/fetch by default; push needs policy set)
category: source_control
binaries:
  - /usr/bin/gh
  - /usr/local/bin/gh
  - /usr/bin/git
  - /usr/local/bin/git
discovery:
  credentials: [api_token]
credentials:
  - name: api_token
    env_vars: [GITHUB_TOKEN, GH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
endpoints:
  # REST API — read-only by default (writes via explicit policy proposal / policy set).
  - id: api
    host: api.github.com
    port: 443
    protocol: rest
    tls: terminate
    access: read-only
    enforcement: enforce
  - id: graphql
    host: api.github.com
    port: 443
    path: /graphql
    protocol: graphql
    tls: terminate
    access: read-only
    enforcement: enforce
  # git smart HTTP: allow clone/fetch (upload-pack); deny receive-pack (push) by omission.
  - id: git
    host: github.com
    port: 443
    protocol: rest
    tls: terminate
    enforcement: enforce
    rules:
      - allow: { method: GET, path: "**" }
      - allow: { method: HEAD, path: "**" }
      - allow: { method: OPTIONS, path: "**" }
      - allow: { method: POST, path: "/**/git-upload-pack" }
