# Cursor Agent — OpenShell-style network-only profile.
# L4 CONNECT tunnel only (no tls:terminate): Cursor Agent speaks HTTP/2 ALPN;
# MITM http/1.1 would fail with "tlsv1 alert no application protocol".
# inject_env: false — use `agent login` (OAuth); do not put placeholders in guest env.

id: cursor
display_name: Cursor Agent
description: Cursor Agent CLI egress (*.cursor.sh / *.cursor.com); OAuth preferred
category: agent
binaries:
  - /usr/bin/agent
  - /usr/local/bin/agent
  - /usr/local/bin/cursor-agent
  - /opt/cursor-agent/**
  - /opt/cursor-agent/versions/*/node
  - /opt/cursor-agent/versions/*/cursor-agent
  - /usr/bin/curl
  - /usr/local/bin/curl
discovery:
  credentials: [api_key]
credentials:
  - name: api_key
    env_vars: [CURSOR_API_KEY]
    required: false
    auth_style: bearer
    header_name: authorization
    inject_env: false
endpoints:
  # L4 tunnel — end-to-end TLS so HTTP/2 ALPN works with api2.cursor.sh
  - id: api2
    host: api2.cursor.sh
    port: 443
  - id: api
    host: api.cursor.sh
    port: 443
  - id: cursor-sh
    host: "**.cursor.sh"
    port: 443
  - id: cursor-com
    host: "**.cursor.com"
    port: 443
  - id: cursor-com-apex
    host: cursor.com
    port: 443
  - id: blob
    host: cursor.blob.core.windows.net
    port: 443
  - id: downloads
    host: downloads.cursor.com
    port: 443
  - id: download-sh
    host: download.cursor.sh
    port: 443
  - id: ms-cdn
    host: cursor.download.prss.microsoft.com
    port: 443
