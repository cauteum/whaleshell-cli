# Claude Code agent provider (OpenShell providers/claude-code.yaml parity).

id: claude-code
display_name: Claude Code
description: Claude Code CLI (Anthropic API)
category: agent
binaries:
  - /usr/bin/claude
  - /usr/local/bin/claude
discovery:
  credentials: [api_key]
credentials:
  - name: api_key
    env_vars: [ANTHROPIC_API_KEY, CLAUDE_API_KEY]
    required: true
    auth_style: header
    header_name: x-api-key
endpoints:
  - id: api
    host: api.anthropic.com
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
  - id: statsig
    host: statsig.anthropic.com
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
  - id: sentry
    host: sentry.io
    port: 443
    protocol: rest
    tls: terminate
    access: read-write
    enforcement: enforce
